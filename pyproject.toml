[project]
name = "factorioproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carlo Barnardo", email = "carlo.barnardo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "networkx>=3.7",
    "pandas>=3.0.5",
    "pulp<3",
    "scipy>=1.18.1",
    "simpy>=4.1.2",
]

[project.scripts]
factorioproject = "factorioproject:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
